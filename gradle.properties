# SortNStock build configuration
#
# NOTE: Minecraft 26.1+ requires Java 25 (NOT Java 21) for the Gradle JVM.
#       If your Java 25 installation lives elsewhere, change the path below
#       (forward slashes also work on Windows), or remove this line and set
#       JAVA_HOME to a Java 25 JDK before running Gradle.
# Machine-specific JDK path - set this to your own Java 25 install, or delete it and let Gradle use JAVA_HOME.
# org.gradle.java.home=C:/Program Files/Java/zulu-25

# This machine's JDK cacerts does not validate the public TLS chain used by the
# Gradle/Maven endpoints, which breaks dependency downloads with
# "PKIX path building failed". Java on Windows can fall back to the OS trust store
# via the WINDOWS-ROOT keystore type. Remove this flag if your JDK trusts the
# public CAs normally.
org.gradle.jvmargs=-Xmx3G
# Some JDKs on Windows cannot validate the public CA chain used by the Gradle/Maven endpoints.
# If dependency downloads fail with "PKIX path building failed", uncomment the next flag.
# org.gradle.jvmargs=-Xmx3G -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
org.gradle.daemon=false
org.gradle.parallel=false

# --- Minecraft / Fabric -----------------------------------------------------
minecraft_version=26.1.2
loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2

# --- Mod metadata -----------------------------------------------------------
mod_version=0.1.2
maven_group=com.sortnstock
archives_base_name=sortnstock-26.1.2

# --- Hard dependency: MaLiLib (config + hotkey system) ----------------------
malilib_version=0.28.12

# --- Soft dependency: Litematica (schematic material source) ----------------
# Compiled against the exact artifact that the Litematica mixin targets.
litematica_version=0.27.14

# --- Soft dependency: QuickShulker (shulker open/transfer helper) -----------
quickshulker_version=3.1.0-26.1

# --- Soft dependency: Mod Menu (config button entry point) ------------------
# Compile-only: Mod Menu is what asks for the "modmenu" entry point, so when it
# is absent the class is never loaded and no dependency is required at runtime.
modmenu_version=18.0.1
